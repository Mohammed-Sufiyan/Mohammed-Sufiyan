name: Contribution snake

# Draws the snake that eats the contribution graph and publishes it to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FF5A1F&color_dots=#ebedf0,#d7f5a0,#b4ec4a,#7cbf1f,#4f8a0b
            dist/snake-dark.svg?palette=github-dark&color_snake=#C6FF3D&color_dots=#161b22,#2a3a12,#4f7a16,#86c21d,#c6ff3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
